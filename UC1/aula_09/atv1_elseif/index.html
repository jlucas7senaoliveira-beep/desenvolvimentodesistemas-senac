<script>

let nome = prompt("Digite o nome do aluno:");

while (nome !== null && nome !== "") {

    while (!isNaN(nome)) {
        alert("Erro! Digite apenas letras para o nome.");
        nome = prompt("Digite o nome do aluno:");
    }

    console.log("Nome:", nome);

    let nota = prompt("Digite a nota de " + nome);

    while (!Number.isFinite(Number(nota))) {
        alert("Erro! Digite uma nota válida.");
        nota = prompt("Digite a nota de " + nome);
    }

    console.log("Nota digitada:", nota);

    let notanum = Number(nota);

    if (notanum < 3) {
        alert(
            "ALUNO: " + nome +
            "\nNOTA: " + notanum +
            "\nREPROVADO"
        );
    } else if (notanum < 6) {
        alert(
            "ALUNO: " + nome +
            "\nNOTA: " + notanum +
            "\nRECUPERAÇÃO"
        );
    } else {
        alert(
            "ALUNO: " + nome +
            "\nNOTA: " + notanum +
            "\nAPROVADO"
        );

    }
    nome = prompt("Digite o nome do próximo aluno:");

}

console.log("Programa encerrado.");
alert("Programa encerrado.");

</script>
